# 네이버 뉴스 — 어댑터 경유 파이프라인 (C3)
#
# **이 파일 하나로 수집부터 적재까지 돈다.** 파이썬 코드를 새로 쓰지 않는다.
# A1 어댑터(configs/sources/naver_news.yaml)가 읽고 정규화한 결과를
# 여기 적힌 매핑대로 meta_news에 넣는다.
#
# 기존 src/pipelines/naver_news_pipeline.py(235줄)와 **공존한다.**
# 점진 이관이 목표선이고, 지금 갈아치우면 검증된 것을 잃는다.
#
# ⚠️ 같은 테이블을 쓰지만 UNIQUE(dataset_id, article_url) + ON CONFLICT라
#    멱등하다. 두 경로가 서로 덮어쓸 뿐 중복이 쌓이지 않는다.

source_spec: configs/sources/naver_news.yaml
dataset_id: urn:naver:news_dataset_38b665      # HBM 뉴스
source_type: news

query:
  query: HBM 반도체

limit: 60

steps: [collect, normalize, store, postprocess]

target:
  table: meta_news
  # normalize 결과 중 **여기 적은 것만** 간다. 원천이 필드를 늘려도
  # 없는 컬럼에 쓰려다 실패하거나 엉뚱한 컬럼에 들어가지 않는다
  columns: [article_url, title, description, naver_url]
  conflict_key: article_url
  # NOT NULL인데 어댑터가 못 채우는 것들. 스펙이 책임진다
  defaults:
    has_content: false
    is_naver_hosted: false

postprocess: [embed]
