<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E75B6"/></marker>
</defs>
<style>
.h{font-size:16px;font-weight:bold;fill:#1F4E79}
.lb{font-size:12px;fill:#555}
.t{font-size:13px;fill:#111}
.thumb{fill:#eef3fb;stroke:#4a6fa5;stroke-width:1.2}
.title{fill:#f6f8fb;stroke:#9fb3cc;stroke-width:1.1}
.meter{fill:#e7edf5}
.bad{fill:#c0563a}
.good{fill:#3f7d55}
</style>

<!-- 상단 정의 -->
<text x="390" y="26" text-anchor="middle" class="h">의미 간극(gap) = 썸네일과 제목이 ‘표현 공간’에서 얼마나 어긋났나</text>
<text x="390" y="46" text-anchor="middle" class="lb">gap = 1 − cos(썸네일 임베딩, 제목 임베딩)   ·   0에 가까울수록 정렬, 1에 가까울수록 비정렬</text>

<!-- ── 왼쪽: 낮은 gap ── -->
<rect x="24" y="66" width="360" height="250" rx="10" fill="#ffffff" stroke="#3f7d55" stroke-width="1.6"/>
<rect x="24" y="66" width="360" height="30" rx="10" fill="#eef5ef" stroke="none"/>
<text x="204" y="86" text-anchor="middle" class="h" fill="#3f7d55">정렬 · 낮은 gap</text>

<rect x="52" y="120" width="130" height="92" rx="8" class="thumb"/>
<text x="117" y="152" text-anchor="middle" class="lb">썸네일</text>
<text x="117" y="176" text-anchor="middle" class="t">🐕 강아지가</text>
<text x="117" y="194" text-anchor="middle" class="t">산책하는 장면</text>

<rect x="224" y="120" width="132" height="92" rx="8" class="title"/>
<text x="290" y="152" text-anchor="middle" class="lb">제목</text>
<text x="290" y="176" text-anchor="middle" class="t">“강아지 산책</text>
<text x="290" y="194" text-anchor="middle" class="t">브이로그”</text>

<line x1="182" y1="166" x2="224" y2="166" stroke="#3f7d55" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="204" y="238" text-anchor="middle" class="lb">코사인 유사도 <tspan font-weight="bold" fill="#3f7d55">높음</tspan></text>

<rect x="52" y="258" width="304" height="20" rx="10" class="meter"/>
<rect x="52" y="258" width="61" height="20" rx="10" class="good"/>
<text x="204" y="300" text-anchor="middle" class="h" fill="#3f7d55">gap ≈ 0.2</text>

<!-- ── 오른쪽: 높은 gap ── -->
<rect x="396" y="66" width="360" height="250" rx="10" fill="#ffffff" stroke="#c0563a" stroke-width="1.6"/>
<rect x="396" y="66" width="360" height="30" rx="10" fill="#f7eeeb" stroke="none"/>
<text x="576" y="86" text-anchor="middle" class="h" fill="#c0563a">비정렬 · 높은 gap</text>

<rect x="424" y="120" width="130" height="92" rx="8" class="thumb"/>
<text x="489" y="152" text-anchor="middle" class="lb">썸네일</text>
<text x="489" y="176" text-anchor="middle" class="t">😲 놀란 얼굴</text>
<text x="489" y="194" text-anchor="middle" class="t">(클릭 유도형)</text>

<rect x="596" y="120" width="132" height="92" rx="8" class="title"/>
<text x="662" y="152" text-anchor="middle" class="lb">제목</text>
<text x="662" y="176" text-anchor="middle" class="t">“오늘의 주식</text>
<text x="662" y="194" text-anchor="middle" class="t">시황 분석”</text>

<line x1="554" y1="166" x2="596" y2="166" stroke="#c0563a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="576" y="238" text-anchor="middle" class="lb">코사인 유사도 <tspan font-weight="bold" fill="#c0563a">낮음</tspan></text>

<rect x="424" y="258" width="304" height="20" rx="10" class="meter"/>
<rect x="424" y="258" width="243" height="20" rx="10" class="bad"/>
<text x="576" y="300" text-anchor="middle" class="h" fill="#c0563a">gap ≈ 0.8</text>

<!-- 하단 주의 -->
<text x="390" y="332" text-anchor="middle" class="lb">※ gap은 ‘표현이 다른 정도’일 뿐, ‘시각 정보가 검색에 유용한 정도’와 동일하지 않음</text>
</svg>
