<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 336" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E75B6"/></marker>
</defs>
<style>
.h{font-size:14px;font-weight:bold;fill:#1F4E79}
.rk{font-size:11px;fill:#8a97a5}
.mv{font-size:15px;font-weight:bold;fill:#1F4E79}
.md{font-size:11.5px;fill:#555}
.rel{fill:#1F4E79}
.oth{fill:none;stroke:#c2ccd8;stroke-width:1.5}
.lbl{font-size:10.5px;fill:#2E75B6;font-weight:bold}
</style>

<text x="300" y="22" text-anchor="middle" class="h">평가 지표 — Top-10 검색 결과에서 무엇을 재는가</text>

<!-- 왼쪽: 순위 리스트 -->
<rect x="26" y="40" width="150" height="264" rx="8" fill="#f6f8fb" stroke="#c9d6e5" stroke-width="1.1"/>
<text x="101" y="58" text-anchor="middle" class="rk" font-weight="bold" fill="#1F4E79">검색 결과 순위</text>
<!-- 행: 1~10, 관련=2·4·9 -->
<g>
<text x="52" y="82" text-anchor="end" class="rk">1</text><circle cx="70" cy="78" r="6" class="oth"/>
<text x="52" y="106" text-anchor="end" class="rk">2</text><circle cx="70" cy="102" r="6" class="rel"/><text x="86" y="106" class="rk" fill="#1F4E79">관련</text>
<text x="52" y="130" text-anchor="end" class="rk">3</text><circle cx="70" cy="126" r="6" class="oth"/>
<text x="52" y="154" text-anchor="end" class="rk">4</text><circle cx="70" cy="150" r="6" class="rel"/><text x="86" y="154" class="rk" fill="#1F4E79">관련</text>
<text x="52" y="178" text-anchor="end" class="rk">5</text><circle cx="70" cy="174" r="6" class="oth"/>
<text x="52" y="202" text-anchor="end" class="rk">6</text><circle cx="70" cy="198" r="6" class="oth"/>
<text x="52" y="226" text-anchor="end" class="rk">7</text><circle cx="70" cy="222" r="6" class="oth"/>
<text x="52" y="250" text-anchor="end" class="rk">8</text><circle cx="70" cy="246" r="6" class="oth"/>
<text x="52" y="274" text-anchor="end" class="rk">9</text><circle cx="70" cy="270" r="6" class="rel"/><text x="86" y="274" class="rk" fill="#1F4E79">관련</text>
<text x="52" y="298" text-anchor="end" class="rk">10</text><circle cx="70" cy="294" r="6" class="oth"/>
</g>
<text x="101" y="322" text-anchor="middle" class="rk">관련 영상 총 5개 · Top-10에 3개</text>

<!-- 첫 관련 표시 -->
<text x="118" y="94" class="lbl">← 첫 관련</text>

<!-- 오른쪽: 지표 설명 -->
<text x="212" y="86" class="mv">MRR@10 = 1 / 2 = 0.50</text>
<text x="212" y="106" class="md">첫 관련 결과 순위의 역수 — 위에 있을수록 ↑</text>

<line x1="212" y1="122" x2="584" y2="122" stroke="#e2e8f0" stroke-width="1"/>

<text x="212" y="156" class="mv">Recall@10 = 3 / 5 = 0.60</text>
<text x="212" y="176" class="md">관련 영상이 Top-10 안에 든 비율</text>

<line x1="212" y1="192" x2="584" y2="192" stroke="#e2e8f0" stroke-width="1"/>

<text x="212" y="226" class="mv">NDCG@10</text>
<text x="212" y="246" class="md">상위 순위일수록 큰 가중으로 합산·정규화</text>
<text x="212" y="264" class="md">(같은 관련이라도 위쪽일수록 점수 ↑)</text>

<line x1="212" y1="282" x2="584" y2="282" stroke="#e2e8f0" stroke-width="1"/>
<text x="212" y="304" class="md">※ RQ2의<tspan font-weight="bold" fill="#1F4E79">Spearman ρ</tspan>는 gap과 순위 변화(Δrank)의 순위상관을 측정</text>
</svg>
