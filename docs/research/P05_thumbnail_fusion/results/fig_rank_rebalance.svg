<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
<marker id="up" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1F4E79"/></marker>
<marker id="dn" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a97a5"/></marker>
</defs>
<style>
.h{font-size:15px;font-weight:bold;fill:#1F4E79}
.lb{font-size:12px;fill:#555}
.tick{font-size:11px;fill:#9aa6b2}
.col{fill:#f6f8fb;stroke:#c9d6e5;stroke-width:1.2}
.hd{fill:#1F4E79}
.rel{fill:#1F4E79}
.oth{fill:#c9d3de}
</style>

<text x="390" y="26" text-anchor="middle" class="h">융합은 ‘상위 노출’이 아니라 ‘깊은 순위의 관련 영상’을 끌어올린다</text>

<!-- 왼쪽 컬럼: 융합 전 -->
<rect x="120" y="70" width="190" height="252" rx="8" class="col"/>
<rect x="120" y="70" width="190" height="30" rx="8" class="hd"/>
<text x="215" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">융합 전 · Text 순위</text>
<text x="112" y="118" text-anchor="end" class="tick">1위</text>
<text x="112" y="316" text-anchor="end" class="tick">100위</text>
<line x1="118" y1="112" x2="118" y2="312" stroke="#e2e8f0" stroke-width="1"/>

<!-- 오른쪽 컬럼: 융합 후 -->
<rect x="470" y="70" width="190" height="252" rx="8" class="col"/>
<rect x="470" y="70" width="190" height="30" rx="8" class="hd"/>
<text x="565" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">융합 후 · Fusion 순위</text>
<text x="668" y="118" text-anchor="start" class="tick">1위</text>
<text x="668" y="316" text-anchor="start" class="tick">100위</text>
<line x1="662" y1="112" x2="662" y2="312" stroke="#e2e8f0" stroke-width="1"/>

<!-- 보조(무관) 점들 -->
<circle cx="215" cy="150" r="5" class="oth"/><circle cx="215" cy="190" r="5" class="oth"/><circle cx="215" cy="278" r="5" class="oth"/>
<circle cx="565" cy="170" r="5" class="oth"/><circle cx="565" cy="230" r="5" class="oth"/><circle cx="565" cy="285" r="5" class="oth"/>

<!-- 관련 영상 A: 상위(8위) → 소폭 하락(10위) -->
<circle cx="290" cy="128" r="8" class="rel"/>
<text x="276" y="132" text-anchor="end" class="lb">8위 · 관련</text>
<circle cx="490" cy="142" r="8" class="rel"/>
<text x="504" y="146" text-anchor="start" class="lb">10위 · 관련</text>
<path d="M300,129 C380,134 410,138 480,142" fill="none" stroke="#8a97a5" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#dn)"/>
<text x="392" y="116" text-anchor="middle" class="lb" fill="#8a97a5">Δrank −2 (소폭 하락)</text>

<!-- 관련 영상 B: 깊은 순위(53위) → 크게 상승(12위) -->
<circle cx="290" cy="236" r="8" class="rel"/>
<text x="276" y="240" text-anchor="end" class="lb">53위 · 관련</text>
<circle cx="490" cy="172" r="8" class="rel"/>
<text x="504" y="176" text-anchor="start" class="lb">12위 · 관련</text>
<path d="M300,234 C384,210 408,186 480,173" fill="none" stroke="#1F4E79" stroke-width="2.6" marker-end="url(#up)"/>
<text x="360" y="192" text-anchor="middle" class="h" font-size="13" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">Δrank +41 (크게 상승)</text>

<!-- 하단 요약 -->
<text x="390" y="344" text-anchor="middle" class="lb">상위 10위 관련 영상은 개선 24%뿐 · 11–50위 93% · 51위+ 100%가 상승 → <tspan font-weight="bold" fill="#1F4E79">깊은 순위 재배치</tspan></text>
</svg>
