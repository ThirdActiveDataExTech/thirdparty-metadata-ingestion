[project]
name = "metadata-ingestion"
version = "0.1.0"
requires-python = ">=3.9"

dependencies = [
    "psycopg2-binary",
    "python-dotenv",
    "requests",
    "sentence-transformers",   # paraphrase-multilingual-mpnet-base-v2 (768 dims)
    "pgvector",                # pgvector Python adapter (vector type support)
    "google-api-python-client", # YouTube Data API v3
    "beautifulsoup4",           # 뉴스/블로그 본문 스크래핑
    "boto3",                    # SeaweedFS S3 클라이언트
    "yt-dlp",                   # YouTube 오디오 다운로드 (트랜스크립트용)
    "faster-whisper",           # 로컬 STT (CTranslate2, CPU 추론)
    # 한국어 형태소 분석 — 키워드 검색 채널의 토큰화 (ADR-010)
    # ⚠️ 0.24.0부터 Apache-2.0, 0.23.2 이하는 LGPL. 하한을 내리지 말 것.
    "kiwipiepy>=0.24.0",
    "PyYAML",                   # 수집 어댑터 소스 스펙(configs/sources/*.yaml) — A1
    "fastapi",                  # 카탈로그 OpenAPI — C6
    "uvicorn[standard]",        # ASGI 서버
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.ruff]
line-length = 100
