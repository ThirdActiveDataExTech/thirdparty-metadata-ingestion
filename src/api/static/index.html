<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThirdEye 내부 개발 콘솔</title>
<!-- 빌드 체인이 없다. 브라우저가 ES 모듈을 그대로 읽는다 —
     고칠 때 새로고침만 하면 되고, 케이웨어가 자기 스택으로 다시 만들 때
     버려질 도구 설정을 저장소에 남기지 않는다. -->
<link rel="stylesheet" href="css/console.css">
</head>
<body>
<header>
  <span class="brand">ThirdEye</span>
  <span class="tag">내부 개발 콘솔 · 프로토타입</span>
  <form id="qf">
    <select id="qsrc">
      <option value="dataset">데이터셋</option>
      <option value="video">영상</option>
      <option value="news">뉴스</option>
      <option value="blog">블로그</option>
    </select>
    <input type="search" id="q" placeholder="검색어를 입력하세요" value="전기차 충전">
    <button type="submit">검색</button>
  </form>
</header>

<nav id="nav"></nav>
<main id="view"><div class="empty">불러오는 중…</div></main>
<script type="module" src="js/app.js"></script>
</body>
</html>
